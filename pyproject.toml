[project]
name = "data-pipeline"
version = "0.1.0"
description = "data-pipeline"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.128.0",
    "jsonpickle>=4.1.1",
    "python-library",
    "python-socketio[client]>=5.16.0",
    "redis>=7.1.0",
    "requests>=2.32.5",
    "uvicorn>=0.40.0",
    "websocket-client>=1.9.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.0",
    "pyright>=1.1.407",
    "pytest>=9.0.1",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.6",
]

[tool.pyright]
typeCheckingMode = "basic"
reportOptionalSubscript = "none"
reportOptionalMemberAccess = "none"
reportOptionalContextManager = "none"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv.sources]
python-library = { path = "libs/python_library-2.2.8-py3-none-any.whl" }
