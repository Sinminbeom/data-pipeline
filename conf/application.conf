[COMMON]
PROJECT_NAME = sensor-data-replayer
CHANNEL_NAME = test

[STORAGE]
ROOT = /home/shinminbeom/infra_glue/personal/sensor-data-replayer/data
PREFIX = split

; STORAGE_CACHE: downloader가 source에서 받아 로컬에 저장하는 캐시 경로.
; 운영 환경에서 STORAGE는 원격(S3/MinIO)으로 교체되지만 STORAGE_CACHE는 항상 로컬.
; streamer는 후속 phase에서 이 경로를 읽도록 전환 예정.
[STORAGE_CACHE]
ROOT = /home/shinminbeom/infra_glue/personal/sensor-data-replayer/data
PREFIX = cache

[IMDG]
SERVER_IP = 127.0.0.1
; SERVER_IP = redis
SERVER_PORT = 6379
POOL_SIZE = 10
SCHEMA_NAME = COM

[REST]
BIND_IP = 0.0.0.0
BIND_PORT = 9999

[STREAM]
STREAM_NAME = downloader_tasks
GROUP_NAME = downloader_group


; STREAM_OUTPUT: sensor 이름 → 송출 IP/PORT 매핑 (replayer 미러)
; 키 형식: <SENSOR_NAME>_IP / <SENSOR_NAME>_PORT (case-insensitive)
[STREAM_OUTPUT]
AT128_ROOF_FRONT_IP = 192.168.20.100
AT128_ROOF_FRONT_PORT = 2368
